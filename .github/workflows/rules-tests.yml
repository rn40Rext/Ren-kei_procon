name: Security Rules Tests

on:
  push:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "tests/rules/**"
      - ".github/workflows/rules-tests.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "tests/rules/**"
      - ".github/workflows/rules-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install rules test dependencies
        run: npm --prefix tests/rules install

      - name: Run Security Rules tests
        run: npm run test:rules
